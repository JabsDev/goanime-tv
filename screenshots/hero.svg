<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="GoAnime TV — Seu anime, direto na sua TV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0F"/>
      <stop offset="0.55" stop-color="#151528"/>
      <stop offset="1" stop-color="#1A1A2E"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.82" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.14" cy="0.95" r="0.62">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E6FBFF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glowCyan)"/>
  <rect width="1200" height="400" fill="url(#glowPurple)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#00E5FF" opacity="0.9"/>

  <!-- play button -->
  <circle cx="952" cy="170" r="150" fill="url(#ringGlow)"/>
  <circle cx="952" cy="170" r="88" fill="#0E0E1E" stroke="#00E5FF" stroke-width="3" opacity="0.95"/>
  <circle cx="952" cy="170" r="66" fill="#00E5FF" opacity="0.14"/>
  <path d="M924 122 L1018 170 L924 218 Z" fill="#00E5FF"/>

  <!-- title -->
  <text x="70" y="150" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#titleGrad)" letter-spacing="1">GoAnime TV</text>

  <!-- tagline -->
  <text x="72" y="218" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#B9CCD0">Seu anime, direto na sua <tspan fill="#00E5FF" font-weight="700">TV</tspan>.</text>

  <!-- chips -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="70" y="272" rx="20" ry="20" width="186" height="48" fill="#1B1B38" stroke="#00E5FF" stroke-opacity="0.5"/>
    <text x="163" y="303" text-anchor="middle" fill="#00E5FF">Android TV</text>

    <rect x="278" y="272" rx="20" ry="20" width="176" height="48" fill="#1B1B38" stroke="#00E5FF" stroke-opacity="0.5"/>
    <text x="366" y="303" text-anchor="middle" fill="#00E5FF">100% D-pad</text>

    <rect x="476" y="272" rx="20" ry="20" width="128" height="48" fill="#1B1B38" stroke="#00E5FF" stroke-opacity="0.5"/>
    <text x="540" y="303" text-anchor="middle" fill="#00E5FF">PT-BR</text>

    <rect x="626" y="272" rx="20" ry="20" width="168" height="48" fill="#1B1B38" stroke="#7C4DFF" stroke-opacity="0.55"/>
    <text x="710" y="303" text-anchor="middle" fill="#B388FF">AniList</text>
  </g>
</svg>

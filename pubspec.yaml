name: goanime_tv
description: "GoAnime TV - Android TV anime streaming app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.1.10
  media_kit_video: ^2.0.0
  media_kit_native_event_loop: ^1.0.7
  media_kit_libs_android_video: ^1.3.3
  http: ^1.1.0
  html: ^0.15.4
  ffi: ^2.1.0
  encrypt: ^5.0.0
  pointycastle: ^3.7.3
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  qr_flutter: ^4.1.0
  webview_flutter: ^4.7.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true

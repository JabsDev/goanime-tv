name: Release APK

# Publica uma release do GitHub com o APK assinado e o changelog.
#
# Convenção de tag (D2): vX.Y.Z+BUILD, BUILD estritamente crescente.
#   ex.: v1.0.1+1000001
#
# Política de chave (Fase 0 - Opção A): a chave DEBUG é a oficial da linha.
# O release build do gradle é assinado com ela. Aqui o mesmo keystore é
# restaurado em ~/.android/debug.keystore a partir do secret, então o APK do
# CI sai com a MESMA chave dos instalados — sem isso o auto-update recusaria
# instalar por cima (I-1). Não troque esta política sem a migração da Fase
# 0-B (aviso + backup), senão todos os aparelhos ficam sem atualizar.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Valida build number estritamente crescente (D2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          BUILD="${TAG##*+}"
          NAME="${TAG%%+*}"
          case "$BUILD" in
            *[!0-9]*|"") echo "::error::Tag sem build number (+N). Use vX.Y.Z+BUILD."; exit 1;;
          esac
          case "$NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag sem semver vX.Y.Z."; exit 1;;
          esac
          LAST="$(git ls-remote --tags origin 'v*' | sed -E 's/.*refs\/tags\/(v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$/\1/' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' | grep -v "^$TAG\$" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+\+//' | sort -n | tail -1)"
          if [ -n "$LAST" ] && [ "$BUILD" -le "$LAST" ]; then
            echo "::error::BUILD $BUILD não é maior que a última release ($LAST). N nunca decresce."
            exit 1
          fi
          # Corpo da tag lido via API (checkout não traz tags anotadas).
          REF_TYPE="$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq .object.type)"
          if [ "$REF_TYPE" = "tag" ]; then
            TARGET="$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq .object.sha)"
            CHANGELOG="$(gh api "repos/${{ github.repository }}/git/tags/$TARGET" --jq .message)"
          else
            CHANGELOG=""
          fi
          if [ -z "${CHANGELOG// }" ]; then
            echo "::error::Tag sem mensagem (changelog) — o diálogo do app mostra este corpo."
            exit 1
          fi

      - name: Restaura o keystore oficial (chave DEBUG = política Fase 0-A)
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > android/goanime-tv.jks
          chmod 600 android/goanime-tv.jks
          cat > android/key.properties <<EOF
          storeFile=goanime-tv.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Build APK release (mesma chave dos instalados)
        run: |
          TAG="${{ github.ref_name }}"
          BUILD_NAME="${TAG#v}"
          BUILD_NAME="${BUILD_NAME%%+*}"
          flutter build apk --release \
            --build-name "$BUILD_NAME" \
            --build-number "${TAG##*+}" \
            --dart-define=WEBVIEW_NAV=true

      - name: Cria release com APK + SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          SHA256="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)"
          ASSET="goanime-tv-$TAG.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$ASSET"
          REF_TYPE="$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq .object.type)"
          if [ "$REF_TYPE" = "tag" ]; then
            TARGET="$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq .object.sha)"
            CHANGELOG="$(gh api "repos/${{ github.repository }}/git/tags/$TARGET" --jq .message)"
          else
            CHANGELOG=""
          fi
          printf '%s\n\n---\n\nSHA256: %s\n' "$CHANGELOG" "$SHA256" > release-notes.md
          gh release create "$TAG" "$ASSET" \
            --title "$TAG" \
            --notes-file release-notes.md